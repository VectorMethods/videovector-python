name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Bot-created release tag, for example videovector-v1.0.0"
        required: true
        type: string
      release_body_sha256:
        description: "SHA-256 of the scanned release body held by vectormethods-public-bot"
        required: true
        type: string
      expected_target_sha:
        description: "Exact commit SHA peeled from the immutable bot-created release tag"
        required: true
        type: string

run-name: Release ${{ inputs.release_tag }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate bot release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate actor and immutable release ref
        id: validate
        env:
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG_PREFIX: videovector-v
        run: |
          set -euo pipefail
          bash scripts/validate_release_request.sh

      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[a-z0-9.-]+)?", version):
              raise SystemExit("invalid release version")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          version_file = Path("videovector/_version.py").read_text(encoding="utf-8")
          expected_line = f'__version__ = "{version}"'
          if package_version != version or expected_line not in version_file:
              print(
                  "Release version must match pyproject.toml and videovector/_version.py",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

  build:
    name: Build and check SDK artifacts
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install checksum-pinned package installer
        run: bash scripts/install_reviewed_uv.sh

      - name: Install hash-locked dependencies
        run: |
          set -euo pipefail
          uv pip install --python "$(command -v python)" --system \
            --require-hashes --requirements requirements-dev.lock
          uv pip install --python "$(command -v python)" --system \
            --no-deps --no-build-isolation --editable .
          uv pip uninstall --python "$(command -v python)" --system pip
          if python -m pip --version >/dev/null 2>&1; then
            echo "pip must not remain installed in the release build environment" >&2
            exit 1
          fi

      - name: Run release checks
        run: |
          set -euo pipefail
          ruff check videovector tests examples scripts
          black --check videovector tests examples scripts
          mypy videovector scripts/release_artifacts.py
          pytest -q tests

      - name: Build deterministic release bundle once
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/release_artifacts.py build \
            --output release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --version "$RELEASE_VERSION" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"
          python scripts/release_artifacts.py verify-bundle \
            --bundle release-bundle \
            --source-sha "$SOURCE_SHA" \
            --tag-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"
          python -m twine check release-bundle/dist/*

      - name: Local wheel install smoke
        run: |
          set -euo pipefail
          python -m venv --without-pip /tmp/videovector-wheel-smoke
          uv pip install \
            --python /tmp/videovector-wheel-smoke/bin/python \
            release-bundle/dist/*.whl
          /tmp/videovector-wheel-smoke/bin/python - <<'PY'
          from videovector import AsyncVideoVector, VideoVector, __version__

          assert VideoVector.__name__ == "VideoVector"
          assert AsyncVideoVector.__name__ == "AsyncVideoVector"
          assert __version__
          PY

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - guard
      - build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-release-bundle
          path: release-bundle

      - name: Classify existing TestPyPI version
        id: registry
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/release_artifacts.py verify-bundle \
            --bundle release-bundle \
            --source-sha "$SOURCE_SHA" \
            --tag-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"
          set +e
          python scripts/release_artifacts.py registry-status \
            --bundle release-bundle \
            --registry testpypi \
            --write-missing release-bundle/publish-testpypi
          status="$?"
          set -e
          case "$status" in
            0) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            3|4) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Publish tested bytes to TestPyPI
        if: ${{ steps.registry.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-bundle/publish-testpypi/

      - name: Verify exact TestPyPI bytes and metadata
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 18); do
            set +e
            python scripts/release_artifacts.py registry-status \
              --bundle release-bundle \
              --registry testpypi
            status="$?"
            set -e
            if [[ "$status" == "0" ]]; then
              exit 0
            fi
            if [[ "$status" != "3" && "$status" != "4" ]]; then
              exit "$status"
            fi
            sleep 10
          done
          exit 1

  smoke-test-testpypi:
    name: Smoke test TestPyPI package
    needs:
      - guard
      - publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release installer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install checksum-pinned package installer
        run: bash scripts/install_reviewed_uv.sh

      - name: Install from TestPyPI and verify import
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 18); do
            rm -rf /tmp/videovector-testpypi-smoke
            python -m venv --without-pip /tmp/videovector-testpypi-smoke
            uv pip install \
              --python /tmp/videovector-testpypi-smoke/bin/python \
              --index-url https://pypi.org/simple/ \
              "httpx>=0.25.0" \
              "pydantic>=2.0.0"
            if uv pip install \
              --python /tmp/videovector-testpypi-smoke/bin/python \
              --no-deps \
              --no-cache \
              --index-url https://test.pypi.org/simple/ \
              "videovector==${RELEASE_VERSION}"; then
              /tmp/videovector-testpypi-smoke/bin/python -c "from videovector import AsyncVideoVector, VideoVector; print(VideoVector.__name__, AsyncVideoVector.__name__)"
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs:
      - guard
      - smoke-test-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-release-bundle
          path: release-bundle

      - name: Classify existing PyPI version
        id: registry
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/release_artifacts.py verify-bundle \
            --bundle release-bundle \
            --source-sha "$SOURCE_SHA" \
            --tag-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"
          set +e
          python scripts/release_artifacts.py registry-status \
            --bundle release-bundle \
            --registry pypi \
            --write-missing release-bundle/publish-pypi
          status="$?"
          set -e
          case "$status" in
            0) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            3|4) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Publish tested bytes to PyPI
        if: ${{ steps.registry.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release-bundle/publish-pypi/

      - name: Verify exact PyPI bytes and metadata
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 18); do
            set +e
            python scripts/release_artifacts.py registry-status \
              --bundle release-bundle \
              --registry pypi
            status="$?"
            set -e
            if [[ "$status" == "0" ]]; then
              exit 0
            fi
            if [[ "$status" != "3" && "$status" != "4" ]]; then
              exit "$status"
            fi
            sleep 10
          done
          exit 1

  smoke-test-pypi:
    name: Smoke test PyPI package
    needs:
      - guard
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release installer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install checksum-pinned package installer
        run: bash scripts/install_reviewed_uv.sh

      - name: Install from PyPI and verify import
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 18); do
            rm -rf /tmp/videovector-pypi-smoke
            python -m venv --without-pip /tmp/videovector-pypi-smoke
            if uv pip install \
              --python /tmp/videovector-pypi-smoke/bin/python \
              --no-cache \
              "videovector==${RELEASE_VERSION}"; then
              /tmp/videovector-pypi-smoke/bin/python -c "from videovector import AsyncVideoVector, VideoVector; print(VideoVector.__name__, AsyncVideoVector.__name__)"
              exit 0
            fi
            sleep 10
          done
          exit 1
