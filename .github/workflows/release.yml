name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Bot-created release tag, for example videovector-v1.0.0"
        required: true
        type: string
      release_body_sha256:
        description: "SHA-256 of the scanned release body held by vectormethods-public-bot"
        required: true
        type: string

run-name: Release ${{ inputs.release_tag }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate bot release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      pypi_exists: ${{ steps.registry.outputs.pypi_exists }}
      testpypi_exists: ${{ steps.registry.outputs.testpypi_exists }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate actor, tag, target, and metadata
        id: validate
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_ACTOR" != "vectormethods-public-bot[bot]" && "$GITHUB_ACTOR" != "vectormethods-public-bot" ]]; then
            echo "Release workflow may only be dispatched by vectormethods-public-bot." >&2
            exit 1
          fi
          release_version_pattern='^videovector-v([0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]+)?)$'
          if [[ "$RELEASE_TAG" =~ $release_version_pattern ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must match videovector-vX.Y.Z." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "release_body_sha256 must be a lowercase SHA-256 digest." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Release tag must point at public main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          RELEASE_VERSION="$version" python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[a-z0-9.-]+)?", version):
              raise SystemExit("invalid release version")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          version_file = Path("videovector/_version.py").read_text(encoding="utf-8")
          expected_line = f'__version__ = "{version}"'
          if package_version != version or expected_line not in version_file:
              print(
                  "Release version must match pyproject.toml and videovector/_version.py",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Check registry version state
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          output_path = os.environ["GITHUB_OUTPUT"]
          checks = {
              "pypi_exists": f"https://pypi.org/pypi/videovector/{version}/json",
              "testpypi_exists": f"https://test.pypi.org/pypi/videovector/{version}/json",
          }
          results = {}
          for key, url in checks.items():
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "vectormethods-videovector-release"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      results[key] = "true"
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      results[key] = "false"
                  else:
                      raise
          with open(output_path, "a", encoding="utf-8") as handle:
              for key, value in results.items():
                  handle.write(f"{key}={value}\n")
          PY

  build:
    name: Build and check SDK artifacts
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release checks
        run: |
          set -euo pipefail
          ruff check videovector tests examples
          mypy videovector
          pytest -q tests
          python -m build
          python -m twine check dist/*

      - name: Local wheel install smoke
        run: |
          set -euo pipefail
          python -m venv /tmp/videovector-wheel-smoke
          /tmp/videovector-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/videovector-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/videovector-wheel-smoke/bin/python - <<'PY'
          from videovector import AsyncVideoVector, VideoVector, __version__

          assert VideoVector.__name__ == "VideoVector"
          assert AsyncVideoVector.__name__ == "AsyncVideoVector"
          assert __version__
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - guard
      - build
    if: ${{ needs.guard.outputs.testpypi_exists != 'true' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  smoke-test-testpypi:
    name: Smoke test TestPyPI package
    needs:
      - guard
      - publish-testpypi
    if: ${{ always() && needs.guard.result == 'success' && (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install from TestPyPI and verify import
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            rm -rf /tmp/videovector-testpypi-smoke
            python -m venv /tmp/videovector-testpypi-smoke
            /tmp/videovector-testpypi-smoke/bin/python -m pip install --upgrade pip
            if /tmp/videovector-testpypi-smoke/bin/python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "videovector==${RELEASE_VERSION}"; then
              /tmp/videovector-testpypi-smoke/bin/python -c "from videovector import AsyncVideoVector, VideoVector; print(VideoVector.__name__, AsyncVideoVector.__name__)"
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs:
      - guard
      - smoke-test-testpypi
    if: ${{ needs.guard.outputs.pypi_exists != 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  smoke-test-pypi:
    name: Smoke test PyPI package
    needs:
      - guard
      - publish-pypi
    if: ${{ always() && needs.guard.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install from PyPI and verify import
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            rm -rf /tmp/videovector-pypi-smoke
            python -m venv /tmp/videovector-pypi-smoke
            /tmp/videovector-pypi-smoke/bin/python -m pip install --upgrade pip
            if /tmp/videovector-pypi-smoke/bin/python -m pip install --no-cache-dir "videovector==${RELEASE_VERSION}"; then
              /tmp/videovector-pypi-smoke/bin/python -c "from videovector import AsyncVideoVector, VideoVector; print(VideoVector.__name__, AsyncVideoVector.__name__)"
              exit 0
            fi
            sleep 10
          done
          exit 1
