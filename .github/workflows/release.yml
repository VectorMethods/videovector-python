name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, matching pyproject.toml and videovector/_version.py"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-videovector-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SDK artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[a-z0-9.-]+)?", version):
              raise SystemExit(f"Invalid release version: {version}")

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          package_version = pyproject["project"]["version"]
          version_file = Path("videovector/_version.py").read_text()
          expected_line = f'__version__ = "{version}"'
          if package_version != version or expected_line not in version_file:
              print(
                  "Release version must match pyproject.toml and videovector/_version.py",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Run release checks
        run: |
          ruff check videovector tests examples
          mypy videovector
          pytest -q tests
          python -m build
          python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  smoke-test-testpypi:
    name: Smoke test TestPyPI package
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install from TestPyPI and verify import
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "videovector==${RELEASE_VERSION}"
          python -c "from videovector import AsyncVideoVector, VideoVector; print(VideoVector.__name__, AsyncVideoVector.__name__)"

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release tag and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="videovector-v${RELEASE_VERSION}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "VideoVector Python SDK ${RELEASE_VERSION}" \
            --generate-notes
