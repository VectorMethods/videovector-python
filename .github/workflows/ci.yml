name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        run: ruff check videovector tests examples

      - name: MyPy
        run: mypy videovector

      - name: Pytest
        run: pytest -q tests

      - name: Build artifacts
        run: python -m build --no-isolation

      - name: Twine check
        run: python -m twine check dist/*

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Scan history and filesystem with checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          mkdir -m 0700 /tmp/gitleaks
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum --check -
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          test -f /tmp/gitleaks/gitleaks
          test ! -L /tmp/gitleaks/gitleaks
          echo 'e18325d568268b6efb6cd0cc721f8bea5667f4cd1c8d03618ab61987f41269ad  /tmp/gitleaks/gitleaks' | sha256sum --check -
          test "$(/tmp/gitleaks/gitleaks version)" = "8.24.3"
          /tmp/gitleaks/gitleaks git --no-banner --redact --log-opts=--all .
          /tmp/gitleaks/gitleaks dir --no-banner --redact .

      - name: Secret pattern scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ignored_parts = {
              ".git",
              ".mypy_cache",
              ".pytest_cache",
              ".ruff_cache",
              "__pycache__",
              "build",
              "dist",
              "node_modules",
          }
          searchable_suffixes = {
              ".py",
              ".md",
              ".toml",
              ".yml",
              ".yaml",
              ".json",
              ".txt",
              ".example",
          }
          patterns = [
              re.compile("sk_" + "live", re.IGNORECASE),
              re.compile("AK" + r"IA[0-9A-Z]{8,}"),
              re.compile("AS" + r"IA[0-9A-Z]{8,}"),
              re.compile("AI" + r"za[0-9A-Za-z_-]{20,}"),
              re.compile("ey" + r"J[A-Za-z0-9_-]{8,}"),
              re.compile("gh" + r"[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile("xo" + r"x[baprs]-[A-Za-z0-9-]{10,}"),
              re.compile("-" * 5 + r"BEGIN [A-Z ]*PRIVATE KEY" + "-" * 5),
              re.compile(r'"private' + r'_key"\s*:'),
          ]

          findings: list[str] = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue
              if path.suffix not in searchable_suffixes and path.name != ".env.example":
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for pattern in patterns:
                  if pattern.search(text) and "test_examples_public_safety.py" not in str(path):
                      findings.append(f"{path}: matches {pattern.pattern}")

          if findings:
              print("\n".join(findings))
              raise SystemExit(1)
          PY
