[build-system]
requires = ["setuptools==80.10.2", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videovector"
version = "1.1.0"
description = "Python SDK for the VideoVector API"
authors = [
    {name = "Vector Methods"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = [
    "video",
    "search",
    "ai",
    "ml",
    "computer-vision",
    "video-understanding",
    "semantic-search",
    "sdk",
    "api",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "build==1.4.4",
    "twine==6.2.0",
    "black==25.1.0",
    # Mypy 2.x no longer accepts a Python 3.9 target. Keep type checking aligned
    # with this package's declared Python 3.9 runtime support.
    "mypy==1.18.2",
    "ruff==0.15.22",
    "setuptools==80.10.2",
    "wheel==0.47.0",
]

[project.urls]
Homepage = "https://github.com/VectorMethods/videovector-python"
Documentation = "https://github.com/VectorMethods/videovector-python#readme"
Repository = "https://github.com/VectorMethods/videovector-python"
Issues = "https://github.com/VectorMethods/videovector-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["videovector*"]

[tool.setuptools.package-data]
videovector = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Current typed dependency releases may use syntax newer than this SDK's
# declared Python 3.9 target. Their public types remain available through
# httpx/pydantic; do not recursively type-check their private implementations.
module = ["anyio.*", "click.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
